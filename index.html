<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coming Soon</title>
<style>
:root{--bg:#f4f2ee;--fg:#141414;--mute:#7a7770;--line:#d9d5cc;--a:#e8c9a8;--b:#b9c7d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0f;--fg:#f1efea;--mute:#8d8a83;--line:#2a2a2c;--a:#5a3d2a;--b:#26384d}}
:root[data-theme="dark"]{--bg:#0e0e0f;--fg:#f1efea;--mute:#8d8a83;--line:#2a2a2c;--a:#5a3d2a;--b:#26384d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;position:relative}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.7;animation:float 18s ease-in-out infinite}
.o1{width:50vmax;height:50vmax;background:var(--a);top:-15vmax;left:-10vmax}
.o2{width:45vmax;height:45vmax;background:var(--b);bottom:-18vmax;right:-12vmax;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:28px 6vw}
.top,.bot{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
.center{text-align:center}
.tag{display:inline-block;padding:7px 16px;border:1px solid var(--line);border-radius:99px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);backdrop-filter:blur(6px)}
h1{font-weight:300;font-size:clamp(46px,11vw,150px);letter-spacing:-.04em;line-height:.95;margin:28px 0 20px}
h1 em{font-style:italic;font-family:Georgia,"Times New Roman",serif;font-weight:400}
p.lead{max-width:44ch;margin:0 auto;color:var(--mute);font-size:clamp(15px,1.7vw,19px);line-height:1.5}
.count{display:flex;justify-content:center;gap:clamp(14px,4vw,48px);margin:44px 0 36px}
.count div{min-width:64px}
.count b{display:block;font-weight:300;font-size:clamp(30px,6vw,64px);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.count span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.btn{display:inline-block;padding:14px 30px;border-radius:99px;background:var(--fg);color:var(--bg);text-decoration:none;font-size:14px;letter-spacing:.06em;transition:transform .3s,opacity .3s}
.btn:hover{transform:translateY(-2px);opacity:.88}
.bot a{color:inherit;text-decoration:none;color:var(--mute);transition:color .3s}
.bot a:hover{color:var(--fg)}
.bot nav{display:flex;gap:22px}
.in{opacity:0;transform:translateY(20px);animation:up 1s ease forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orb,.in{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div>
<main>
<div class="top in"><span>Ninuja Nirandul</span><span>2026</span></div>
<div class="center">
<span class="tag in d1">Something new is on the way</span>
<h1 class="in d2">Coming <em>Soon</em></h1>
<p class="lead in d2">We are putting the finishing touches on our new website. Thank you for your patience, we will be live shortly.</p>
<div class="count in d3" id="count">
<div><b id="dd">00</b><span>Days</span></div>
<div><b id="hh">00</b><span>Hours</span></div>
<div><b id="mm">00</b><span>Minutes</span></div>
<div><b id="ss">00</b><span>Seconds</span></div>
</div>
<a class="btn in d4" href="mailto:www.ninujanirandul.com">Get in touch</a>
</div>
<div class="bot in d4"><span>www.ninujanirandul.com</span><nav><a href="#"></a><a href="#"></a></nav></div>
</main>
<script>
//
var target=new Date("2027-01-15T09:00:00").getTime();
function p(n){return String(n).padStart(2,"0")}
function tick(){
var d=Math.max(0,target-Date.now());
document.getElementById("dd").textContent=p(Math.floor(d/864e5));
document.getElementById("hh").textContent=p(Math.floor(d%864e5/36e5));
document.getElementById("mm").textContent=p(Math.floor(d%36e5/6e4));
document.getElementById("ss").textContent=p(Math.floor(d%6e4/1e3));
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
