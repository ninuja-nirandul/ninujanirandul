<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NINUJA — Conceptual, Portrait &amp; Storytelling Photography</title>
  <meta name="description" content="NINUJA editorial minimalist photography portfolio featuring conceptual portraiture, weddings, engagements, and couple stories." />

  <!-- Google Fonts: Montserrat (200/300/400/500) & Cormorant Garamond (400/500/400 italic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    /**
     * Tailwind CSS Design Tokens for NINUJA Editorial Portfolio
     * Palette: Crisp White (#FFFFFF), Warm Alabaster (#F5F4F0), Deep Charcoal (#2B2B2B)
     */
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFFFFF',
            alabaster: '#F5F4F0',
            charcoal: '#2B2B2B',
            stone: '#6E6D69',
            hairline: '#D8D6D0'
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            serif: ['Cormorant Garamond', 'Georgia', 'serif']
          },
          letterSpacing: {
            editorial: '0.24em',
            wide2: '0.28em',
            ultra: '0.32em'
          }
        }
      }
    };
  </script>

  <style>
    /* Core CSS Custom Properties */
    :root {
      --bg-canvas: #FFFFFF;
      --bg-alabaster: #F5F4F0;
      --text-charcoal: #2B2B2B;
      --text-stone: #6E6D69;
      --border-hairline: #D8D6D0;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-charcoal);
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      margin: 0;
    }

    /* Editorial Typography Helpers */
    .font-editorial-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 200;
      letter-spacing: 0.25em;
      text-transform: uppercase;
    }

    .font-editorial-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      letter-spacing: 0.26em;
      text-transform: uppercase;
    }

    .font-editorial-body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      line-height: 1.85;
    }

    /* Scroll Reveal Entrance Animation */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.85s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Subtle Editorial Image Zoom on Hover */
    .img-zoom-wrap {
      overflow: hidden;
    }

    .img-zoom-wrap img {
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), filter 0.7s ease;
    }

    .img-zoom-wrap:hover img {
      transform: scale(1.035);
    }

    /* Full-Screen Hero Slide Crossfade & Gentle Scale Motion */
    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1.15s cubic-bezier(0.22, 1, 0.36, 1), visibility 1.15s;
    }

    .hero-slide.active {
      opacity: 1;
      visibility: visible;
    }

    .hero-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 6.5s ease-out;
    }

    .hero-slide.active img {
      transform: scale(1);
    }

    /* Full-Screen Warm Alabaster Overlay Menu */
    #menu-overlay {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s;
    }

    #menu-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    #menu-overlay .menu-item-anim {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #menu-overlay.open .menu-item-anim {
      opacity: 1;
      transform: translateY(0);
    }

    /* Expandable Submenu & FAQ Drawer */
    .submenu-drawer {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.35s ease,
                  margin 0.35s ease;
    }

    .submenu-drawer.expanded {
      max-height: 280px;
      opacity: 1;
      margin-top: 1rem;
    }

    /* Route View Fade Transition */
    .view-section {
      animation: pageFadeIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Primary Editorial Charcoal CTA Button */
    .btn-editorial {
      background-color: #2B2B2B;
      color: #FFFFFF;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 11px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      padding: 18px 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.35s ease, transform 0.25s ease;
      cursor: pointer;
    }

    .btn-editorial:hover {
      background-color: #444340;
    }

    .btn-editorial:active {
      transform: scale(0.985);
    }

    /* Minimalist Bottom-Border Form Inputs */
    .input-editorial {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid #B8B6B0;
      padding: 12px 4px;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      color: #2B2B2B;
      outline: none;
      transition: border-color 0.3s ease;
      border-radius: 0;
    }

    .input-editorial:focus {
      border-bottom-color: #2B2B2B;
    }

    /* Pure White Full-Screen Lightbox Modal */
    #lightbox {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #lightbox.open {
      opacity: 1;
      visibility: visible;
    }

    /* Subtle Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #FFFFFF;
    }

    ::-webkit-scrollbar-thumb {
      background: #D8D6D0;
    }
  </style>
</head>

        header.classList.add('py-6');
        wordmark.classList.remove('text-charcoal');

      const isExpanded = drawer.classList.toggle('expanded');
      if (plus) plus.textContent = isExpanded ? '−' : '+';
    }

      const container = document.getElementById('app-content');
      switch (route) {
        case 'about':
          container.innerHTML = renderAboutView();
          break;
        case 'portfolio':
          container.innerHTML = renderPortfolioOverviewView();
          break;
        case 'category':
          container.innerHTML = renderCategoryGalleryView(currentCategory);
          break;
        case 'blog':
          container.innerHTML = renderBlogView();
          break;
        case 'info':
          container.innerHTML = renderInfoView();
          if (param === 'faq') {
            setTimeout(() => {
              const el = document.getElementById('faq-anchor');
              if (el) el.scrollIntoView({ behavior: 'smooth' });
            }, 120);
          }
          break;
        case 'contact':
          container.innerHTML = renderContactView();
          break;
        case 'home':
        default:
          container.innerHTML = renderHomeView();
          startHeroAutoplay();
          break;
      }

      updateHeaderTheme();
      initScrollReveal();
    }

    /**
     * 6. SLIDERS & LIGHTBOX CONTROLS
     */
    function stepHero(dir) {
      const slides = document.querySelectorAll('.hero-slide');
      if (!slides.length) return;
      slides[heroIndex].classList.remove('active');
      heroIndex = (heroIndex + dir + slides.length) % slides.length;
      slides[heroIndex].classList.add('active');
    }

    function startHeroAutoplay() {
      clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        if (currentRoute === 'home') stepHero(1);
      }, 6000);
    }

    function stepTestimonial(dir) {
      const stage = document.getElementById('testimonial-stage');
      if (!stage) return;
      stage.style.opacity = '0';
      setTimeout(() => {
        testimonialIndex = (testimonialIndex + dir + TESTIMONIALS.length) % TESTIMONIALS.length;
        document.getElementById('testimonial-quote').textContent = TESTIMONIALS[testimonialIndex].quote;
        document.getElementById('testimonial-client').textContent = TESTIMONIALS[testimonialIndex].client;
        stage.style.opacity = '1';
      }, 280);
    }

    function openLightbox(sourceKey, idx) {
      lightboxPhotos = sourceKey === 'selected' ? SELECTED_WORKS : (GALLERIES[sourceKey]?.photos || []);
      lightboxIndex = idx;
      renderLightboxSlide();
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }

    function stepLightbox(dir) {
      if (!lightboxPhotos.length) return;
      const img = document.getElementById('lightbox-img');
      img.style.opacity = '0';
      setTimeout(() => {
        lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
        renderLightboxSlide();
        img.style.opacity = '1';
      }, 180);
    }

    function renderLightboxSlide() {
      const item = lightboxPhotos[lightboxIndex];
      const img = document.getElementById('lightbox-img');
      img.src = item.src;
      img.alt = item.caption;
      img.className = `max-h-[68vh] w-auto object-contain transition-opacity duration-300 ${item.bw ? 'grayscale' : ''}`;
      document.getElementById('lightbox-caption').textContent = item.caption;
      document.getElementById('lightbox-counter').textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
    }

    /**
     * 7. KEYBOARD SHORTCUTS, INTERSECTION REVEAL & TOAST
     */
    document.addEventListener('keydown', (e) => {
      const lbOpen = document.getElementById('lightbox').classList.contains('open');
      const menuOpen = document.getElementById('menu-overlay').classList.contains('open');

      if (e.key === 'Escape') {
        if (lbOpen) closeLightbox();
        if (menuOpen) toggleMenu(false);
      } else if (lbOpen && e.key === 'ArrowRight') {
        stepLightbox(1);
      } else if (lbOpen && e.key === 'ArrowLeft') {
        stepLightbox(-1);
      } else if (!lbOpen && !menuOpen && currentRoute === 'home') {
        if (e.key === 'ArrowRight') stepHero(1);
        if (e.key === 'ArrowLeft') stepHero(-1);
      }
    });

    function initScrollReveal() {
      const elements = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.12 });

      elements.forEach(el => observer.observe(el));
    }

    let toastTimeout = null;
    function showToast(msg) {
      const box = document.getElementById('toast-box');
      box.textContent = msg;
      box.classList.remove('opacity-0');
      box.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        box.classList.remove('opacity-100');
        box.classList.add('opacity-0');
      }, 2800);
    }

    function populateInstagramGrid() {
      const grid = document.getElementById('instagram-grid');
      grid.innerHTML = INSTAGRAM_PHOTOS.map((p, idx) => `
        <a href="#instagram-${idx}" onclick="event.preventDefault(); showToast('Viewing @ninuja.photo post');"
          class="img-zoom-wrap block aspect-square bg-alabaster">
          <img src="${p.src}" alt="Instagram preview ${idx + 1}" loading="lazy"
            class="w-full h-full object-cover ${p.bw ? 'grayscale' : ''}" />
        </a>
      `).join('');
    }

    /**
     * 8. INITIALIZE APPLICATION
     */
    window.addEventListener('DOMContentLoaded', () => {
      populateInstagramGrid();
      navigateTo('home');
    });
  </script>
</body>
</html>
